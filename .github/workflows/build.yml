name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  wait-for-ci:
    name: Wait for successful CI
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          deadline=$((SECONDS + 1800))

          while (( SECONDS < deadline )); do
            run_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20" \
              --jq '.workflow_runs | map(select(.head_branch == "master" or .head_branch == "main")) | sort_by(.created_at) | last | .id // empty')

            if [[ -z "$run_id" ]]; then
              echo "CI for ${GITHUB_SHA} has not appeared yet; waiting..."
              sleep 15
              continue
            fi

            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // empty')
            url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.html_url')

            if [[ "$status" != "completed" ]]; then
              echo "CI is ${status}: ${url}"
              sleep 15
              continue
            fi

            if [[ "$conclusion" == "success" ]]; then
              echo "CI succeeded: ${url}"
              exit 0
            fi

            echo "CI concluded with '${conclusion}': ${url}"
            exit 1
          done

          echo "Timed out waiting for CI for ${GITHUB_SHA}"
          exit 1

  build:
    needs: wait-for-ci
    if: always() && (needs.wait-for-ci.result == 'success' || needs.wait-for-ci.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run version -- ${{ steps.version.outputs.version }}
      - name: Run checks
        run: |
          npm test
          npm run build
      - name: Run Rust tests
        working-directory: src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"resources":null}}'
        run: cargo test --locked --all-targets
      - name: Build application
        run: npm run tauri build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ttsbard-echo-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
