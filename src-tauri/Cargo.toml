[package]
name = "ttsbard-echo"
version = "0.2.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
parking_lot = "0.12"
dirs = "5"
reqwest = { version = "0.12", features = ["json"] }
eventsource-client = "0.12"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
image = "0.25"
url = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
# Windows-only API surface, kept to the minimum namespaces actually used:
# - Win32_Security_Cryptography: DPAPI (CryptProtectData/CryptUnprotectData)
#   for access-token storage in settings.json, ADR-0024; matches the
#   cfg(windows)-gated crypto code in config/secret.rs.
# - Win32_Foundation, Win32_Security, Win32_Security_Authorization,
#   Win32_System_Threading: restricted DACLs for configuration files
#   (SetNamedSecurityInfoW and friends) in config/acl.rs, roadmap 010
#   task 006. The crate is not built on other platforms, matching the
#   cfg(windows)-gated code in config/secret.rs and config/acl.rs.
# - DataExchange, LibraryLoader and WindowsAndMessaging: early single-instance
#   receiver and bounded second-launch activation, roadmap 013.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
